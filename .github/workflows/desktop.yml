# Desktop builds of the game for Windows, macOS and Linux, published as a GitHub Release.
#
# Release:   git tag v0.2.0 && git push origin v0.2.0
#            (the tag sets the version; no need to edit package.json)
# Try it:    Actions -> Desktop app -> Run workflow (builds downloadable artifacts, no release)
#
# Actions are pinned to commit SHAs (the tag is in the comment). Only the release job can write.
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - name: Package
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          body: |
            Mac Packwala and the Curse of the Stale Cache: a classic point-and-click adventure about Drupal AI.

            **Download**
            - Windows: `Mac-Packwala-windows-setup.exe` (installer) or `Mac-Packwala-windows-portable.exe` (no install)
            - macOS: `Mac-Packwala-mac-universal.dmg` (Apple Silicon and Intel)
            - Linux: `Mac-Packwala-linux-x86_64.AppImage` (make it executable, then run it)

            **Check your download**
            These builds are not signed with an Apple or Microsoft certificate, so your OS can't vouch for them.
            Check instead that the file is the one this repository's workflow built:
            - `gh attestation verify <file> --repo ${{ github.repository }}` (GitHub CLI), or
            - compare `sha256sum <file>` with `SHA256SUMS.txt` from this release.

            **First launch**
            - Windows: SmartScreen may say "Windows protected your PC". Click "More info", then "Run anyway".
            - macOS: the first launch is blocked as "from an unidentified developer". Open System Settings,
              Privacy & Security, and click "Open Anyway" next to Mac Packwala.
            - Linux: `chmod +x Mac-Packwala-linux-x86_64.AppImage`. Some distributions need `libfuse2` for AppImages.

            **AI disclosure**: this game was vibe coded with AI. Its music and voices were generated with ElevenLabs.
