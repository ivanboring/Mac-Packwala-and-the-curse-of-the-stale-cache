# Desktop builds of the game for Windows, macOS and Linux, published as a GitHub Release.
#
# Release:   git tag v0.2.0 && git push origin v0.2.0
#            (the tag sets the version; no need to edit package.json)
# Try it:    Actions -> Desktop app -> Run workflow (builds downloadable artifacts, no release)
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - name: Package
        run: npx electron-builder --publish never
        env:
          # no Apple Developer certificate: build an unsigned app instead of failing
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            Mac Packwala and the Curse of the Stale Cache: a classic point-and-click adventure about Drupal AI.

            **Download**
            - Windows: `...-windows-setup.exe` (installer) or `...-windows-portable.exe` (no install)
            - macOS: `...-mac-universal.dmg` (Apple Silicon and Intel)
            - Linux: `...-linux-x86_64.AppImage` (make it executable, then run it)

            **First launch**
            - Windows: SmartScreen may say "Windows protected your PC". Click "More info", then "Run anyway".
            - macOS: the app is not signed by Apple. Right-click the app, choose Open, then Open again.
              If macOS says it is damaged, run `xattr -dr com.apple.quarantine "/Applications/Mac Packwala.app"`.
            - Linux: `chmod +x Mac-Packwala-*.AppImage`. Some distributions need `libfuse2` for AppImages.

            **AI disclosure**: this game was vibe coded with AI. Its music and voices were generated with ElevenLabs.
